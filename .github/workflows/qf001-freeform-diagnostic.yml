name: QF001 Freeform Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [feature/qf001-freeform-diagnostic]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test coordinate bounds
        run: |
          mkdir -p /tmp/bid-test
          javac -d /tmp/bid-test freeform-probe/app/src/main/java/ro/dj88bid/freeform/Bounds.java freeform-probe/tests/BoundsTest.java
          java -cp /tmp/bid-test ro.dj88bid.freeform.BoundsTest
      - name: Locate or install Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            TMP="$(mktemp -d)"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$TMP/tools.zip"
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv "$TMP/cmdline-tools" "$SDK_ROOT/cmdline-tools/bid-11076708"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bid-11076708/bin/sdkmanager"
            rm -rf "$TMP"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
            LICENSE_STATUS=${PIPESTATUS[1]}
            set -o pipefail
            test "$LICENSE_STATUS" = 0
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
      - name: Build diagnostic APK
        run: gradle -p freeform-probe --no-daemon assembleDebug
      - name: Verify and package
        run: |
          mkdir -p dist
          cp freeform-probe/app/build/outputs/apk/debug/app-debug.apk dist/DJ88-BID-QF001-ACC-STANDBY-V2-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/DJ88-BID-QF001-ACC-STANDBY-V2-TEST.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-QF001-ACC-STANDBY-V2-TEST
          path: dist/
          if-no-files-found: error

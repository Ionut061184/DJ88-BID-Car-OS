name: BID 10022 verified build
on:
  push:
    branches: [feature/bid-10022-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract integrated source
        run: |
          echo '48ef2954464a88ffc0fc83ba8932469f66df689928dc10ab816d45c0a12acf69  DJ88-BID-10022-PROIECT-INTEGRAT.zip' | sha256sum -c
          unzip -q DJ88-BID-10022-PROIECT-INTEGRAT.zip
      - name: Verify cumulative assets before compilation
        working-directory: DJ88-BID-10022-PROIECT-INTEGRAT
        run: |
          cd app/src/main/assets
          sha256sum -c <<'EOF'
          17afdcd419307951af50666dfad6666139cdaedb34007318cdc931731f662f5f  bid_approved.png
          17afdcd419307951af50666dfad6666139cdaedb34007318cdc931731f662f5f  bid_fullbleed.png
          67f3193d4f3d433ccef7904184f6c41bac99c3b2a521097797de9e99664cfb5d  bid_theme_builder.js
          7f331c005671d253f165667983d1da7f6a27f2d89a2e2a5efb7769700eafc643  index.html
          EOF
          for f in *.js; do node --check "$f"; done
      - name: Run editor unit tests
        working-directory: DJ88-BID-10022-PROIECT-INTEGRAT
        run: |
          cmp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate or install Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            TMP="$(mktemp -d)"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$TMP/tools.zip"
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv "$TMP/cmdline-tools" "$SDK_ROOT/cmdline-tools/bid-11076708"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bid-11076708/bin/sdkmanager"
            rm -rf "$TMP"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
            LICENSE_STATUS=${PIPESTATUS[1]}
            set -o pipefail
            test "$LICENSE_STATUS" = 0
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure sideload-only target SDK lint exception
        working-directory: DJ88-BID-10022-PROIECT-INTEGRAT
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          assert s.count("android {") == 1
          assert "targetSdk = 28" in s
          s = s.replace("android {", 'android {\n    // QF001 sideload compatibility: not a Google Play release.\n    lint { disable += "ExpiredTargetSdkVersion" }', 1)
          p.write_text(s)
          PY
      - name: Integrate additional general settings
        run: |
          python integration10022/apply_general.py DJ88-BID-10022-PROIECT-INTEGRAT
          cp integration10022/bid_general.js DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/
          cd DJ88-BID-10022-PROIECT-INTEGRAT
          node --check app/src/main/assets/bid_general.js
          node --check app/src/main/assets/bid_theme_builder.js
          cp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
          cd app/src/main/assets
          sha256sum -c <<'EOF'
          17afdcd419307951af50666dfad6666139cdaedb34007318cdc931731f662f5f  bid_approved.png
          17afdcd419307951af50666dfad6666139cdaedb34007318cdc931731f662f5f  bid_fullbleed.png
          EOF
      - name: Validate and connect online catalog
        run: python integration10022/apply_catalog.py DJ88-BID-10022-PROIECT-INTEGRAT
      - name: Integrate external map launch options
        run: |
          python integration10022/apply_external_maps.py DJ88-BID-10022-PROIECT-INTEGRAT
          node --check DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/bid_general.js
      - name: Integrate version-aware catalog and editor layering
        run: |
          python integration10022/apply_catalog_editor.py DJ88-BID-10022-PROIECT-INTEGRAT
          cd DJ88-BID-10022-PROIECT-INTEGRAT
          node --check app/src/main/assets/bid_theme_builder.js
          cp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
      - name: Integrate automation tool launcher links
        run: |
          python integration10022/apply_automation_tools.py DJ88-BID-10022-PROIECT-INTEGRAT
          node --check DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/bid_general.js
      - name: Integrate Freeform map test
        run: |
          python integration10022/apply_freeform.py DJ88-BID-10022-PROIECT-INTEGRAT
          node --check DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/bid_general.js
      - name: Integrate named Tasker commands
        run: |
          python integration10022/apply_tasker_commands.py DJ88-BID-10022-PROIECT-INTEGRAT
          node --check DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/bid_general.js
      - name: Harden editor element locks and run regression tests
        run: |
          python integration10022/apply_lock_hardening.py DJ88-BID-10022-PROIECT-INTEGRAT
          cd DJ88-BID-10022-PROIECT-INTEGRAT
          node --check app/src/main/assets/bid_theme_builder.js
          cp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
      - name: Integrate native widget clipping and group protections
        run: |
          python integration10022/apply_native_clip_groups.py DJ88-BID-10022-PROIECT-INTEGRAT
          cp integration10022/test_groups_native_clip.js DJ88-BID-10022-PROIECT-INTEGRAT/tests/editor10022/
          cd DJ88-BID-10022-PROIECT-INTEGRAT
          node --check app/src/main/assets/bid_theme_builder.js
          cp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
      - name: Integrate opt-in Tasker event bridge
        run: |
          python integration10022/apply_tasker_events.py DJ88-BID-10022-PROIECT-INTEGRAT
          node --check DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/bid_general.js
      - name: Connect Tasker editor visibility events
        run: |
          python integration10022/apply_tasker_editor_events.py DJ88-BID-10022-PROIECT-INTEGRAT
          node --check DJ88-BID-10022-PROIECT-INTEGRAT/app/src/main/assets/bid_general.js
      - name: Integrate native widget entrance animation
        run: |
          python integration10022/apply_native_entrance.py DJ88-BID-10022-PROIECT-INTEGRAT
          cd DJ88-BID-10022-PROIECT-INTEGRAT
          node --check app/src/main/assets/bid_theme_builder.js
          cp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
      - name: Integrate catalog preview cards
        run: |
          python integration10022/apply_catalog_previews.py DJ88-BID-10022-PROIECT-INTEGRAT
          cd DJ88-BID-10022-PROIECT-INTEGRAT
          node --check app/src/main/assets/bid_theme_builder.js
          cp app/src/main/assets/bid_theme_builder.js tests/editor10022/bid_theme_builder.js
          for f in tests/editor10022/test_*.js; do node "$f" || exit 1; done
      - name: Configure separate test application
        working-directory: DJ88-BID-10022-PROIECT-INTEGRAT
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          import re
          s,n=re.subn(r'applicationIdSuffix\s*=\s*"\.widgetlab"', 'applicationIdSuffix = ".widgetlab.test10022"',s)
          assert n==1, "Unexpected application identifier configuration"
          p.write_text(s)
          PY
      - name: Compile isolated test APK
        working-directory: DJ88-BID-10022-PROIECT-INTEGRAT
        env:
          BID_GOOGLE_MAPS_KEY: ${{ secrets.BID_GOOGLE_MAPS_KEY }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleLabSafeDebug
          mkdir -p dist
          cp app/build/outputs/apk/labSafe/debug/app-labSafe-debug.apk dist/DJ88-BID-10022-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/DJ88-BID-10022-TEST.apk > dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/DJ88-BID-10022-TEST.apk > dist/package.txt
          grep -q "name='ro.dj88bid.car.widgetlab.test10022'" dist/package.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf '%s\n' 'Separate debug-signed test application. Does not update the existing BID package. Test only while parked. Google Maps authorization may require the new package and certificate. Device behavior not validated.' > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-10022-TEST-PREVIEWS
          path: DJ88-BID-10022-PROIECT-INTEGRAT/dist/
          if-no-files-found: error

          Path("dist/packaged-integrity.txt").write_text("APK CRC, MASTER SHA-256 and cumulative asset parity: PASS\n")
          PY
      - name: Record final cumulative source and test evidence
        working-directory: DJ88-BID-10022-PROIECT-INTEGRAT
        run: |

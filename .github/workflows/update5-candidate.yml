name: Update 5 - Build 14 verified candidate
on:
  push:
    branches: [feature/update5-smart-system]
    paths: ['DJ88-BID-Update3-Etapa8-System-candidat.zip', '.github/workflows/update5-candidate.yml', 'tools/import_update3.py', 'app/src/main/java/ro/dj88bid/car/**', 'app/src/main/assets/bid_qf_vehicle.js', 'tests/test_update4_can_browser.py', 'tools/apply_update5_antiglare.py', 'tests/test_update5_antiglare.py', 'tools/apply_update5_battery_guard.py', 'app/src/main/assets/bid_service.js', 'tests/test_update5_service.py', 'tools/apply_update5_quickstart.py', 'tests/test_update5_quickstart.py', 'app/src/main/assets/bid_security.js', 'tests/test_update5_security.py', 'tools/apply_update5_recovery.py', 'tests/test_update5_recovery.py', 'tools/apply_update5_smart_display.py', 'tests/test_update5_smart_display.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/feature/update5-smart-system'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import exact candidate archive
        run: python3 tools/import_update3.py DJ88-BID-Update3-Etapa8-System-candidat.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reversible QF body-sharing helper (mock device only)
        run: python tests/test_qf_body_share.py
      - name: Run cumulative browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cp -r app/src/main/assets tests/update3_browser/assets
          sed -i "s|executable_path='/usr/bin/chromium',||" tests/update3_browser/test_status.py
          python tests/update3_browser/test_status.py
      - name: Attach CAN diagnostic UI and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text()
          assert s.count("</body>")==1
          p.write_text(s.replace("</body>",'<script src="bid_qf_vehicle.js"></script></body>'))
          PY
          python tests/test_update4_can_browser.py
      - name: Apply and verify Anti-Glare
        run: |
          python tools/apply_update5_antiglare.py
          python tests/test_update5_antiglare.py
          python tests/test_update4_can_browser.py
      - name: Extend and test Battery Guard
        run: |
          python tools/apply_update5_battery_guard.py
          cp app/src/main/assets/bid_battery.js tests/update3_browser/assets/
          python - <<'PY'
          from pathlib import Path
          p=Path("tests/update3_browser/test_status.py")
          s=p.read_text()
          for old,state in [
              ("assert 'joasă persistentă' in page.locator('#bidBatteryState').inner_text()", "low"),
              ("assert 'ridicată persistentă' in page.locator('#bidBatteryState').inner_text()", "high"),
              ("assert 'indisponibilă' in page.locator('#bidBatteryState').inner_text()", "unavailable"),
              ("assert page.locator('#bidBatteryNow').inner_text()=='13.8 V'", "normal"),
          ]:
              assert s.count(old)==1, old
              s=s.replace(old,old+"\n    assert page.locator('#bidVoltageText').get_attribute('data-bid-guard')=='"+state+"'")
          p.write_text(s)
          PY
          python tests/update3_browser/test_status.py
      - name: Attach and test BID Service
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text()
          assert s.count("</body>")==1
          p.write_text(s.replace("</body>",'<script src="bid_service.js"></script></body>'))
          PY
          python tests/test_update5_service.py
          python tests/test_update4_can_browser.py
          python tests/test_update5_antiglare.py
      - name: Extend and test Quick Start
        run: |
          python tools/apply_update5_quickstart.py
          python tests/test_update5_quickstart.py
          python tests/test_update5_service.py
          python tests/test_update4_can_browser.py
      - name: Attach and test optional Security
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/assets/index.html")
          s=p.read_text()
          assert s.count("</body>")==1
          p.write_text(s.replace("</body>",'<script src="bid_security.js"></script></body>'))
          PY
          python tests/test_update5_security.py
          python tests/test_update5_quickstart.py
          python tests/test_update5_service.py
          python tests/test_update4_can_browser.py
      - name: Extend and verify Recovery
        run: |
          python tools/apply_update5_recovery.py
          python tests/test_update5_recovery.py
          python tests/test_update5_security.py
          python tests/test_update5_quickstart.py
          python tests/test_update5_service.py
          python tests/test_update4_can_browser.py
          python tests/test_update5_antiglare.py
      - name: Final Smart Display and cumulative checks
        run: |
          python tools/apply_update5_smart_display.py
          python tests/test_update5_smart_display.py
          python tests/test_update5_antiglare.py
          python tests/test_update5_recovery.py
          python tests/test_update5_security.py
          python tests/test_update5_quickstart.py
          python tests/test_update5_service.py
          python tests/test_update4_can_browser.py
      - name: Isolate test application from working Build 14
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          for old, new in [
              ('applicationIdSuffix = ".labtest"', 'applicationIdSuffix = ".update5test"'),
              ('manifestPlaceholders["bidAppLabel"] = "DJ 88 BID TEST"', 'manifestPlaceholders["bidAppLabel"] = "DJ 88 BID UPDATE 5 TEST"'),
          ]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          assert 'manifestPlaceholders["bidHomeEnabled"] = "false"' in s
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run native decoder regression (synthetic frames)
        run: |
          mkdir -p /tmp/bid-qf-tests
          javac -d /tmp/bid-qf-tests app/src/main/java/ro/dj88bid/car/QfVehiclePacket.java tests/QfVehiclePacketTest.java
          java -cp /tmp/bid-qf-tests ro.dj88bid.car.QfVehiclePacketTest
          javac -d /tmp/bid-qf-tests app/src/main/java/ro/dj88bid/car/QfOutsideTemperature.java tests/QfOutsideTemperatureTest.java
          java -cp /tmp/bid-qf-tests ro.dj88bid.car.QfOutsideTemperatureTest
          javac -d /tmp/bid-qf-tests app/src/main/java/ro/dj88bid/car/QfCabinPacket.java tests/QfCabinPacketTest.java
          java -cp /tmp/bid-qf-tests ro.dj88bid.car.QfCabinPacketTest
          javac -d /tmp/bid-qf-tests app/src/main/java/ro/dj88bid/car/QfRadarPacket.java tests/QfRadarPacketTest.java
          java -cp /tmp/bid-qf-tests ro.dj88bid.car.QfRadarPacketTest
      - name: Check exact OEM multimedia and key routing
        run: python tests/test_qf_oem_media.py
      - name: Check foreground lifecycle and cleanup contract
        run: python tests/test_qf_lifecycle.py
      - name: Check private BID artwork import contract
        run: python tests/test_bid_car_artwork.py
      - name: Check optional BID appearance contract
        run: python tests/test_bid_appearance.py
      - name: Check home artwork editor and touch zone contract
        run: python tests/test_bid_home_editor.py
      - name: Verify preinstalled Android SDK on runner
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile lab candidate only
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon :app:assembleLabSafeDebug
      - name: Verify packaged assets and APK identity
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/labSafe/debug/app-labSafe-debug.apk dist/DJ88-BID-Update5-SMART-SYSTEM-TEST.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/DJ88-BID-Update5-SMART-SYSTEM-TEST.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging dist/DJ88-BID-Update5-SMART-SYSTEM-TEST.apk | grep -F "package: name='ro.dj88bid.car.update5test'"
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile("dist/DJ88-BID-Update5-SMART-SYSTEM-TEST.apk") as z:
              for p in Path("app/src/main/assets").iterdir():
                  if p.is_file() and p.name.startswith(("bid_", "index.html")):
                      assert z.read("assets/" + p.name) == p.read_bytes(), p.name
          print("Packaged assets verified.")
          PY
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-Update5-SMART-SYSTEM-TEST
          path: dist/
          if-no-files-found: error

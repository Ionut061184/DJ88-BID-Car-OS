name: Build DJ88 BID stable signed APK
on:
  workflow_dispatch:
jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BID_KEYSTORE_BASE64: ${{ secrets.BID_KEYSTORE_BASE64 }}
      BID_KEYSTORE_PASSWORD: ${{ secrets.BID_KEYSTORE_PASSWORD }}
      BID_KEY_ALIAS: ${{ secrets.BID_KEY_ALIAS }}
      BID_KEY_PASSWORD: ${{ secrets.BID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BID_KEYSTORE_BASE64 BID_KEYSTORE_PASSWORD BID_KEY_ALIAS BID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing protected GitHub Actions secret: $name"
              exit 1
            fi
          done
          test -s app/src/main/assets/bid_approved.png
      - name: Prepare temporary signing keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dj88-signing"
          printf '%s' "$BID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dj88-signing/bid-release.jks"
          test -s "$RUNNER_TEMP/dj88-signing/bid-release.jks"
          echo "BID_KEYSTORE_PATH=$RUNNER_TEMP/dj88-signing/bid-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK with permanent signing key
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify signed release and record provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          APK="$OUT/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$OUT/SIGNATURE.txt"
          sha256sum "$APK" > "$OUT/SHA256SUMS.txt"
          {
            echo "GitHub run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "Package: ro.dj88bid.car"
            echo "Signed release. Verify the signing certificate before installing over an existing version."
            echo "Uninstalling an older differently signed build can erase BID shortcut settings."
            echo "Original Themes QF001 and firmware are untouched."
          } > "$OUT/BUILD-INFO.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-Launcher-stable-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SIGNATURE.txt
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/BUILD-INFO.txt
          if-no-files-found: error
      - name: Remove signing keystore from runner
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/dj88-signing"

name: BID GPS native compile LAB
on:
  push:
    branches: ['feature/bid-gps-speed-lab']
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line tools not found in $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Assemble isolated native donor LAB
        run: gradle --no-daemon --stacktrace :app:assembleLabSafeDebug
      - name: Export internal build
        run: |
          set -euo pipefail
          mkdir -p dist
          file="app/build/outputs/apk/labSafe/debug/app-labSafe-debug.apk"
          test -f "$file"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$file" > dist/signature.txt
          cp "$file" dist/INTERNAL-NATIVE-DONOR-NOT-FOR-INSTALLATION.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf '%s\n' 'INTERNAL ONLY: Native GPS candidate compiled with repository assets. Exact TOUCH23 MASTER assets and device behavior not yet validated. Do not install or treat as a release.' > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BID-GPS-INTERNAL-NATIVE-DONOR
          path: dist/*
          if-no-files-found: error

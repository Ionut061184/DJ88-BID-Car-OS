name: BID GPS native compile LAB
on:
  push:
    branches: ['feature/bid-gps-speed-lab']
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile GPS native candidate
        run: gradle --no-daemon --stacktrace :app:compileLabSafeDebugKotlin
      - name: Document build scope
        run: |
          mkdir -p dist
          printf '%s\n' 'Native Kotlin compilation only. MASTER assets and TOUCH23 integration not yet validated. Not an installable release.' > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BID-GPS-native-compile-only
          path: dist/README.txt
          if-no-files-found: error

name: Build DJ88 BID Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check approved BID image
        run: |
          if [ ! -s app/src/main/assets/bid_approved.png ]; then
            echo "::error::Image missing: upload bid_approved.png into app/src/main/assets/"
            exit 1
          fi
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

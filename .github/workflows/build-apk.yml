name: Build DJ88 BID Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test read-only QF001 APK analyzer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check approved BID image
        run: |
          if [ ! -s app/src/main/assets/bid_approved.png ]; then
            echo "::error::Image missing: upload bid_approved.png into app/src/main/assets/"
            exit 1
          fi
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android sdkmanager not installed on runner"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleLabSafeDebug assembleThemesCandidateDebug
      - name: Verify both APKs and record checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for flavor in labSafe themesCandidate; do
            file="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -s "$file"
            cp "$file" "dist/DJ88-BID-$flavor-debug.apk"
            sha256sum "dist/DJ88-BID-$flavor-debug.apk" >> dist/SHA256SUMS.txt
            "$APKSIGNER" verify --print-certs "$file" > "dist/$flavor-signature.txt"
          done
          echo "LAB SAFE: opens manually; does not register HOME." > dist/README.txt
          echo "THEMES CANDIDATE: exposes HOME alias; OEM Themes recognition and signature NOT verified." >> dist/README.txt
          echo "Do NOT modify system, set candidate as default HOME, or flash firmware." >> dist/README.txt
          echo "GitHub commit: $GITHUB_SHA" >> dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-QF001-two-variants
          path: dist/*
          if-no-files-found: error

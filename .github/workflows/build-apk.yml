name: Build DJ88 BID Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/bid-black-statusbar', 'feature/bid-native-google-maps']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test read-only QF001 APK analyzer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify final approved BID artwork by SHA256
        run: |
          if [ ! -s app/src/main/assets/bid_approved.png ]; then
            echo "::error::Image missing: upload bid_approved.png into app/src/main/assets/"
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum app/src/main/assets/bid_approved.png | cut -d' ' -f1)"
          APPROVED_SHA="746b42fecf45cdb9216b06ee996f3520a33f9a9cefe9d816927db349f4800202"
          if [ "$ACTUAL_SHA" != "$APPROVED_SHA" ]; then
            echo "::error::Wrong BID image. Expected final approved 1280x720 BID image SHA256 $APPROVED_SHA, found $ACTUAL_SHA"
            exit 1
          fi
      - name: Verify exact approved 1280x720 final BID image (no regeneration)
        run: |
          set -euo pipefail
          file="app/src/main/assets/bid_fullbleed.png"
          test -s "$file"
          expected="fbebff471162177ce8df8c7e7f157b29692e2750d3b3b3ba9f8a0eb3139bfc2b"
          actual="$(sha256sum "$file" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Incorrect BID final PNG: $actual (expected $expected)"
            exit 1
          fi
          # PNG IHDR stores width/height as big-endian uint32. Verify with standard Python.
          python3 -c 'import struct; from pathlib import Path; p=Path("app/src/main/assets/bid_fullbleed.png").read_bytes(); assert p[:8]==bytes.fromhex("89504e470d0a1a0a") and struct.unpack(">II",p[16:24])==(1280,720)'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android sdkmanager not installed on runner"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        env:
          BID_GOOGLE_MAPS_KEY: ${{ secrets.BID_GOOGLE_MAPS_KEY }}
        run: gradle --no-daemon --stacktrace assembleLabSafeDebug assembleThemesCandidateDebug
      - name: Verify both APKs and record checksums
        env:
          APPROVED_SHA: 746b42fecf45cdb9216b06ee996f3520a33f9a9cefe9d816927db349f4800202
          FINAL_SHA: fbebff471162177ce8df8c7e7f157b29692e2750d3b3b3ba9f8a0eb3139bfc2b
        run: |
          set -euo pipefail
          mkdir -p dist
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for flavor in labSafe themesCandidate; do
            file="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -s "$file"
            # Compare the artwork IN the compiled APK against the approved source.
            unzip -p "$file" assets/bid_approved.png > "dist/$flavor-bid-image.png"
            unzip -p "$file" assets/bid_fullbleed.png > "dist/$flavor-bid-fullbleed.png"
            test -s "dist/$flavor-bid-fullbleed.png"
            test -s "dist/$flavor-bid-image.png"
            actual="$(sha256sum "dist/$flavor-bid-image.png" | cut -d' ' -f1)"
            if [ "$actual" != "$APPROVED_SHA" ]; then
              echo "::error::APK $flavor embeds the wrong BID source image: $actual"
              exit 1
            fi
            # Verify the exact final full-screen PNG survives packaging byte-for-byte.
            final_actual="$(sha256sum "dist/$flavor-bid-fullbleed.png" | cut -d' ' -f1)"
            if [ "$final_actual" != "$FINAL_SHA" ]; then
              echo "::error::APK $flavor embeds wrong final BID image: $final_actual"
              exit 1
            fi
            unzip -p "$file" assets/bid_runtime.js | grep -q 'function luxury(on=true)'
            unzip -p "$file" assets/index.html | grep -q 'onclick="luxury(true)"'
            cp "$file" "dist/DJ88-BID-$flavor-debug.apk"
            sha256sum "dist/DJ88-BID-$flavor-debug.apk" >> dist/SHA256SUMS.txt
            "$APKSIGNER" verify --print-certs "$file" > "dist/$flavor-signature.txt"
          done
          echo "LAB SAFE: opens manually; does not register HOME." > dist/README.txt
          echo "THEMES CANDIDATE: exposes HOME alias; OEM Themes recognition and signature NOT verified." >> dist/README.txt
          echo "Do NOT modify system, set candidate as default HOME, or flash firmware." >> dist/README.txt
          echo "GitHub commit: $GITHUB_SHA" >> dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-QF001-two-variants
          path: dist/*
          if-no-files-found: error

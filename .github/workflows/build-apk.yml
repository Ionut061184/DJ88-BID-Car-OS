name: Build DJ88 BID Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test read-only QF001 APK analyzer
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check approved BID image
        run: |
          if [ ! -s app/src/main/assets/bid_approved.png ]; then
            echo "::error::Image missing: upload bid_approved.png into app/src/main/assets/"
            exit 1
          fi
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android sdkmanager not installed on runner"; exit 1; fi
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Record APK checksum and signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner missing"; exit 1; fi
          "$APKSIGNER" verify --print-certs "$APK" | tee app/build/outputs/apk/debug/SIGNATURE.txt
          {
            echo "GitHub run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "Version is set by Gradle via GITHUB_RUN_NUMBER."
            echo "Warning: default debug keys can change between GitHub runners."
            echo "An APK signed by a different key may require uninstall/reinstall."
            echo "Uninstalling erases app data and configured auto shortcuts."
            echo "Never overwrite system Themes or QF001 firmware."
          } > app/build/outputs/apk/debug/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJ88-BID-Launcher-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/SIGNATURE.txt
            app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error

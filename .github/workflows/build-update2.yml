name: BID Update 2 MASTER
on:
  workflow_dispatch:
  push:
    branches: ['feature/bid-adaptive-gps-status']
    paths: ['update2-master-meteo-3d.zip', '.github/workflows/build-update2.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import exact MASTER resource archive
        run: |
          set -euo pipefail
          test -f update2-master-meteo-3d.zip || { echo "::error::Upload the exact tested update2-master-meteo-3d.zip to this branch root; old artwork must not be built."; exit 1; }
          echo "19d4e72ca3ccfea71be1c782e0e77f9161eb01c1e26bc536d4c28eea611f03d2  update2-master-meteo-3d.zip" | sha256sum -c -
          mkdir -p /tmp/bid-update2
          unzip -q update2-master-meteo-3d.zip -d /tmp/bid-update2
          cd /tmp/bid-update2
          sha256sum -c SHA256SUMS.txt
          echo "e7eb12698d98d64ce14a42d39f13901127204eb396553cf12a0b85992a6bd2b1  assets/bid_fullbleed.png" | sha256sum -c -
          echo "0e98e109b4402fdece4a4dcefeff287e4414ee5487f7e7b8d7e0f9e5cffd31fe  assets/bid_approved.png" | sha256sum -c -
          cp assets/* "$GITHUB_WORKSPACE/app/src/main/assets/"
      - name: Check JavaScript and simulate weather, connectivity and display
        run: |
          set -euo pipefail
          for f in /tmp/bid-update2/assets/*.js; do node --check "$f"; done
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 -c "from pathlib import Path; p=Path('/tmp/bid-update2/test_status.py'); p.write_text(p.read_text().replace(\"executable_path='/usr/bin/chromium',\",''))"
          python3 /tmp/bid-update2/test_status.py
          python3 -m unittest discover -s tests -p 'test_qf001_themes_contract.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build separate lab candidate first
        run: gradle --no-daemon --stacktrace assembleLabSafeDebug assembleThemesCandidateDebug
      - name: Verify embedded MASTER and APK signatures
        run: |
          set -euo pipefail
          mkdir -p dist
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for variant in labSafe themesCandidate; do
            file="app/build/outputs/apk/$variant/debug/app-$variant-debug.apk"
            for asset in bid_approved.png bid_fullbleed.png index.html bid_status.css bid_status.js bid_runtime.js bid_adaptive.js; do
              unzip -p "$file" "assets/$asset" | cmp - "/tmp/bid-update2/assets/$asset"
            done
            "$APKSIGNER" verify --print-certs "$file" > "dist/$variant-signature.txt"
            cp "$file" "dist/DJ88-BID-Update2-$variant-debug.apk"
          done
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf '%s\n' "Test builds only. Use labSafe first. No boot animation added. OEM compatibility and signature continuity are unverified. Do not remove the working launcher." > dist/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BID-Update2-MASTER-test
          path: dist/*
          if-no-files-found: error

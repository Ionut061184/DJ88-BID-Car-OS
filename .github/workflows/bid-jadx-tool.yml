name: BID - JADX tool download
on:
  workflow_dispatch:
  push:
    branches: [feature/bid-10022-integration]
    paths: ['.github/workflows/bid-jadx-tool.yml']
permissions:
  contents: read
jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download official JADX 1.5.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o jadx-1.5.3.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          unzip -q jadx-1.5.3.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version
          sha256sum jadx-1.5.3.zip > JADX_SHA256.txt
      - name: Locate or install Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            TMP="$(mktemp -d)"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$TMP/tools.zip"
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv "$TMP/cmdline-tools" "$SDK_ROOT/cmdline-tools/bid-11076708"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bid-11076708/bin/sdkmanager"
            rm -rf "$TMP"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
            LICENSE_STATUS=${PIPESTATUS[1]}
            set -o pipefail
            test "$LICENSE_STATUS" = 0
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
      - name: Retrieve official Android signing utility
        run: |
          set -euo pipefail
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
          java -jar apksigner.jar version
          sha256sum apksigner.jar > APKSIGNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BID-JADX-1.5.3
          path: |
            jadx-1.5.3.zip
            JADX_SHA256.txt
            apksigner.jar
            APKSIGNER_SHA256.txt
          if-no-files-found: error
          retention-days: 7
